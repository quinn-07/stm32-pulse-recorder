<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
<title id="title">A 1500 microsecond period in a 1 kHz pulse train</title>
<desc id="desc">Host replay. Sixteen periods before trigger, one outlier at zero, and eight periods after trigger. The shaded band spans 900 to 1100 microseconds.</desc>
